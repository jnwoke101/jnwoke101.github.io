.circle {
  width: 200px;
  height: auto; /* allow figcaption outside */
  border-radius: 50%;
  background-color: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  text-align: center;
  color: white;
  font-weight: bold;
  padding: 10px;
}


    .circle:hover {

    }

    .circle a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      text-decoration: none;
      user-select: none;
    }

    .circle a:hover {
      text-decoration: underline;
    }

    .carousel-wrapper {
      position: relative;
      overflow: hidden;
      margin-bottom: 6rem;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .carousel-slide {
      min-width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      padding: 0;
      font-size: 2rem;
      color: #2ac3de;
      cursor: pointer;
      z-index: 10;
      box-shadow: none;
    }

    .carousel-arrow.left {
      left: 1rem;
    }

    .carousel-arrow.right {
      right: 1rem;
    }

    #suggestions {
  z-index: 9999 !important;
}

  <!-- JavaScript -->
<script>
  // --- Project Search Logic ---
  const searchInput = document.getElementById("projectSearch");
  const suggestionBox = document.getElementById("suggestions");

  const projects = [
    { title: "Smart Firewall", url: "smart-firewall.html" },
    { title: "Pi IDS", url: "pi-ids.html" },
    { title: "Secure Cloud Storage with Azure Key Vault & Encryption", url: "https://jnwoke101.github.io/Projects/HomeLabs/HomeLab1/homelab1.html" },
    { title: "Threat Feed", url: "threat-feed.html" },
    { title: "Home Network", url: "home-network.html" },
    { title: "Home SOC", url: "home-soc.html" },
    { title: "Log Tracker", url: "log-tracker.html" },
    { title: "Race Condition Vulnerability", url: "https://jnwoke101.github.io/Projects/CTF/CTF1/ctf1.html" },
    { title: "CKME Support Access Gained", url: "https://jnwoke101.github.io/Projects/CTF/CTF2/ctf2.html" },
    { title: "THM Blue", url: "thm-blue.html" },
    { title: "XSS Acme", url: "xss-acme.html" },
    { title: "SQL Bug", url: "sql-bug.html" },
    { title: "RCE Report", url: "rce-report.html" },
    { title: "Burp Exploit", url: "burp-exploit.html" },
    { title: "Net Mon", url: "net-mon.html" },
    { title: "Py Auto", url: "py-auto.html" },
    { title: "Log Parse", url: "log-parse.html" },
    { title: "Cloud Sync", url: "cloud-sync.html" },
    { title: "Threat Intel", url: "threat-intel.html" },
    { title: "DNS Watch", url: "dns-watch.html" }
  ];

  searchInput.addEventListener("input", function (e) {
    const input = e.target.value.toLowerCase();
    suggestionBox.innerHTML = "";

    if (!input.trim()) {
      suggestionBox.classList.add("hidden");
      return;
    }

    const matches = projects.filter(p => p.title.toLowerCase().includes(input));

    if (matches.length > 0) {
      suggestionBox.classList.remove("hidden");
      matches.forEach(p => {
        const li = document.createElement("li");
        li.textContent = p.title;
        li.className = "px-4 py-2 hover:bg-[#2ac3de] hover:text-[#0d1117] cursor-pointer";
        li.onclick = () => {
          window.location.href = p.url;
        };
        suggestionBox.appendChild(li);
      });
    } else {
      suggestionBox.classList.add("hidden");
    }
  });

  searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
    }
  });

  document.addEventListener("click", function (e) {
    if (!e.target.closest("#projectSearch") && !e.target.closest("#suggestions")) {
      suggestionBox.classList.add("hidden");
    }
  });

  // --- Filter Setup ---
  const filters = [
    "SOC & SIEM", "Penetration Testing", "Vulnerability Management", "Threat Hunting", "Incident Response",
    "Blue Team (Defense)", "Red Team (Offense)", "Malware Analysis", "Digital Forensics", "Risk Management",
    "Python", "PowerShell", "JavaScript", "SQL", "YAML",
    "Firewalls", "IDS/IPS", "Endpoint Protection", "VPNs", "System Administration", "Proxies", "Load Balancers", "Network Segmentation",
    "Azure", "AWS", "Google Cloud", "Kali Linux", "pfSense", "Active Directory", "Windows Server", "Linux",
    "Burp Suite", "Nessus/OpenVAS", "Wireshark", "Metasploit", "Bash", "Splunk", "ELK Stack", "OSINT"
  ];

  window.addEventListener("DOMContentLoaded", () => {
    const container = document.getElementById("filterContainer");
    if (container) {
      filters.forEach(f => {
        const label = document.createElement("label");
        label.className = "flex items-center space-x-2 text-sm text-[#c9d1d9]";
        label.innerHTML = `<input type="checkbox" class="accent-[#2ac3de]"> <span>${f}</span>`;
        container.appendChild(label);
      });

      document.querySelectorAll("#filterContainer input[type='checkbox']").forEach(cb => {
        cb.addEventListener("change", () => {
          const selected = Array.from(document.querySelectorAll("#filterContainer input[type='checkbox']:checked"))
            .map(el => el.nextElementSibling.textContent.trim());

          const allSections = document.querySelectorAll("section");
          const circles = document.querySelectorAll(".circle");
          const carousels = document.querySelectorAll(".carousel-wrapper");

          if (selected.length === 0) {
            // ✅ Restore full layout
            allSections.forEach(section => section.classList.remove("hidden"));
            circles.forEach(c => c.classList.remove("hidden"));
            carousels.forEach(carousel => {
              carousel.style.display = "";
              carousel.querySelectorAll(".carousel-arrow").forEach(arrow => arrow.style.display = "");
              const track = carousel.querySelector('.carousel-track');
              if (track) {
                track.style.flexWrap = "";
                track.style.justifyContent = "";
              }
            });
            restartCarouselAutoSlide(); // ✅ Restart auto-slide
          } else {
            // ✅ Show only filtered items
            allSections.forEach(section => section.classList.add("hidden"));
            circles.forEach(el => {
              const tags = el.getAttribute("data-tags").split(",").map(t => t.trim());
              const matches = selected.some(tag => tags.includes(tag));

              const outerSection = el.closest("section");
              if (matches) {
                el.classList.remove("hidden");
                if (outerSection) outerSection.classList.remove("hidden");

                const track = el.closest(".carousel-track");
                if (track) {
                  track.style.flexWrap = "wrap";
                  track.style.justifyContent = "flex-start";
                }

                const wrapper = el.closest(".carousel-wrapper");
                if (wrapper) {
                  wrapper.style.display = "block";
                  wrapper.querySelectorAll(".carousel-arrow").forEach(arrow => arrow.style.display = "none");
                }

                const heading = outerSection?.querySelector("h2");
                if (heading) heading.classList.remove("hidden");
              } else {
                el.classList.add("hidden");
              }
            });

            stopCarouselAutoSlide(); // ✅ Stop auto-slide during filtering
          }
        });
      });
    }
  });

  function toggleFilters() {
    const el = document.getElementById("filterContainer");
    el.classList.toggle("hidden");
  }

  // === CAROUSEL AUTO SLIDE + ARROW CONTROL ===
  const carouselIntervals = [];

  document.querySelectorAll(".carousel-wrapper").forEach((wrapper, i) => {
    const track = wrapper.querySelector(".carousel-track");
    const slides = wrapper.querySelectorAll(".carousel-slide");
    const leftArrow = wrapper.querySelector(".carousel-arrow.left");
    const rightArrow = wrapper.querySelector(".carousel-arrow.right");

    let index = 0;

    const updateCarousel = () => {
      track.style.transform = `translateX(-${index * 100}%)`;
    };

    const nextSlide = () => {
      index = (index + 1) % slides.length;
      updateCarousel();
    };

    const prevSlide = () => {
      index = (index - 1 + slides.length) % slides.length;
      updateCarousel();
    };

    const intervalId = setInterval(nextSlide, 5000);
    carouselIntervals.push(intervalId);

    rightArrow.addEventListener("click", nextSlide);
    leftArrow.addEventListener("click", prevSlide);
  });

  function stopCarouselAutoSlide() {
    carouselIntervals.forEach(id => clearInterval(id));
  }

  function restartCarouselAutoSlide() {
    document.querySelectorAll(".carousel-wrapper").forEach((wrapper, i) => {
      const track = wrapper.querySelector(".carousel-track");
      const slides = wrapper.querySelectorAll(".carousel-slide");
      let index = 0;

      const updateCarousel = () => {
        track.style.transform = `translateX(-${index * 100}%)`;
      };

      const nextSlide = () => {
        index = (index + 1) % slides.length;
        updateCarousel();
      };

      const newIntervalId = setInterval(nextSlide, 5000);
      carouselIntervals[i] = newIntervalId;
    });
  }
</script>
