<!DOCTYPE html>

<head>

  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

  <style>
    /* Scrollbar Styling */
    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #161b22;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #2ac3de;
      border-radius: 10px;
      border: 2px solid #161b22;
    }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Courier New', monospace;
    }

    .timeline {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 9%;
    }

    .timeline .timeline-row {
      display: flex;
      column-gap: 64px;
      flex-wrap: wrap;
    }

    .timeline-row .timeline-column {
      flex: 1 1 320px;
    }

    .timeline-column .title {
      position: relative;
      display: inline-block;
      font-size: 28px;
      margin: 32px 0 16px 30px;
    }

    .timeline-column .timeline-box {
      position: relative;
      border-left: none;
    }

    .timeline-box .timeline-content::before {
      display: none;
    }

    .timeline-box .timeline-content {
      position: relative;
      padding-left: 27px;
    }

    .timeline-content .content {
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 32px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .timeline-content .content .year {
      font-size: 16px;
      color: #0ef;
    }

    .timeline-content .content h3 {
      font-size: 19px;
      margin: 8px 0;
    }

    .timeline-content .content p {
      font-size: 16px;
    }

    /* ==============================
       Certification Fix Styles
       ============================== */
    .timeline .content {
      min-height: auto !important;
      height: auto !important;
    }

    #certSlideshow {
      height: 720px !important;
    }

    .cert-slide img {
      width: 1100px !important;
      height: 620px !important;
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      #certSlideshow {
        height: 500px !important;
      }
      .cert-slide img {
        width: 850px !important;
        height: 480px !important;
      }
    }

    @media (max-width: 768px) {
      #certSlideshow {
        height: 400px !important;
      }
      .cert-slide img {
        width: 700px !important;
        height: 400px !important;
      }
    }

    @media (max-width: 480px) {
      #certSlideshow {
        height: 300px !important;
      }
      .cert-slide img {
        width: 90% !important;
        height: auto !important;
      }
    }
  </style>
</head>

  <!-- Slideshow Script -->
  <script>
    const slides = document.querySelectorAll(".cert-slide");
    let currentIndex = 0;
    let interval = setInterval(nextSlide, 5000);

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.style.opacity = i === index ? "1" : "0";
        slide.style.zIndex = i === index ? "1" : "0";
      });
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % slides.length;
      showSlide(currentIndex);
    }

    function prevSlide() {
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      showSlide(currentIndex);
    }

    document.getElementById("nextBtn").addEventListener("click", () => {
      clearInterval(interval);
      nextSlide();
      interval = setInterval(nextSlide, 5000);
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      clearInterval(interval);
      prevSlide();
      interval = setInterval(nextSlide, 5000);
    });

    showSlide(currentIndex);
  </script>
